name: ihs_godot_view
description: >-
  Run a Godot game inside a Flutter app on ivi-homescreen, as a platform view
  backed by LibGodot (dma-buf, DRM plane, VkImage, EGLImage or shared-memory
  hand-off, whichever the backend offers).
version: 0.1.0
publish_to: 'none'
repository: https://github.com/jwinarske/ihs_godot_view

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  # VirtualGamepad's labels. Embedded targets often ship no system fonts
  # (the SA8155P image has none), and Text then draws nothing; bundling the
  # one face the labels use makes them render everywhere.
  fonts:
    - family: IhsGodotViewLabel
      fonts:
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
